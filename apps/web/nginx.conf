# SPA server (nginx-unprivileged, port 8080). TLS and HSTS are handled by Caddy.
server_tokens off;

map $uri $cache_control {
  default                         "no-cache";
  "~*\.[0-9a-z_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
  ~*^/brand/                      "public, max-age=86400";
  ~*\.(woff2|svg|ico)$            "public, max-age=86400";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API is routed by Caddy; never serve index.html for unknown API paths.
  location /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
