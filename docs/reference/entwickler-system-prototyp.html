<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Talent – Talent-System (Prototyp)</title>
<style>
:root{
  --bg:#F4F6FA; --card:#fff; --ink:#0F1729; --muted:#5B677D; --line:#E2E7F0; --line2:#CDD5E3;
  --blue:#2F6BFF; --blue-d:#1E4FD0; --blue-l:#E8F0FF; --green:#12A36B; --green-l:#E3F6EE; --amber:#C27A00; --amber-l:#FFF3DC; --red:#D2483B;
  --nav:#0A0F1A;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--nav);color:#C5CEDF;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;padding:4px 8px 18px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--blue);display:grid;place-items:center}
.brand svg{width:18px;height:18px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;text-align:left;width:100%;font-weight:500}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv.on{background:rgba(47,107,255,.22);color:#fff}
.nv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv .ct{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:99px}
.side .sp{flex:1}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:3px;margin:6px 4px}
.lang button{flex:1;border:0;background:none;color:#C5CEDF;padding:6px;border-radius:7px;font-weight:600;font-size:13px}
.lang button.on{background:#fff;color:var(--nav)}
.demo{font-size:12px;color:#8E9BB3;padding:8px 10px;border-top:1px solid rgba(255,255,255,.1);margin-top:6px}
/* main */
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1400px;width:100%}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:26px;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-d);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.d:hover{border-color:var(--red);color:var(--red)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat b{font-size:28px;letter-spacing:-.02em;display:block}
.stat span{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* filters */
.filters{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500}
button.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.tag.g{background:var(--green-l);color:var(--green)}
.tag.a{background:var(--amber-l);color:var(--amber)}
.tag.x{background:#EEF1F6;color:var(--muted)}
/* dev cards */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:16px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:12px}
.dc:hover{border-color:var(--blue);box-shadow:0 8px 24px -12px rgba(47,107,255,.35);transform:translateY(-2px)}
.av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.dc h3{font-size:16px;letter-spacing:-.01em}
.dc small{color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:5px}
/* detail */
.back{border:0;background:none;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;margin-bottom:12px;padding:0}
.back:hover{color:var(--blue)}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.hd{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.hd .av{width:64px;height:64px;font-size:22px;border-radius:16px}
.sec{margin-top:22px}
.sec h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.exp{padding:12px 0;border-top:1px solid var(--line)}
.exp:first-of-type{border-top:0;padding-top:0}
.exp b{display:block}
.exp .m{color:var(--muted);font-size:13px}
.sk{display:grid;grid-template-columns:1fr 110px 54px;gap:10px;align-items:center;padding:6px 0}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:6px;border-radius:3px;background:#E2E7F0}
.dots i.f{background:var(--blue)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.edit-sk{display:grid;grid-template-columns:1fr 100px 80px 34px;gap:8px;margin-bottom:8px}
.edit-ex{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#F8FAFD}
.bar{height:8px;border-radius:8px;background:#E8ECF3;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),#6FA0FF)}
.bar.g i{background:var(--green)}
.match{display:grid;grid-template-columns:44px 1fr 180px auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.match:first-child{border-top:0}
.pct{font-size:20px;font-weight:700;letter-spacing:-.02em}
.miss{color:var(--red);font-size:12.5px;font-weight:600}
/* import */
.drop{border:2px dashed var(--line2);border-radius:16px;padding:44px 20px;text-align:center;background:#fff;transition:.15s}
.drop.over,.drop:hover{border-color:var(--blue);background:var(--blue-l)}
.drop svg{width:38px;height:38px;stroke:var(--blue);fill:none;stroke-width:1.5;margin-bottom:8px}
.note{background:var(--amber-l);color:#7A4B00;border-radius:10px;padding:10px 14px;font-size:13px}
.prog{height:8px;background:#E8ECF3;border-radius:8px;overflow:hidden;margin:14px auto;max-width:340px}
.prog i{display:block;height:100%;width:0;background:var(--blue);animation:pg 1.8s ease forwards}
@keyframes pg{to{width:100%}}
/* modal / sheet */
.ov{position:fixed;inset:0;background:rgba(10,15,26,.6);z-index:50;display:none;overflow:auto;padding:24px}
.ov.on{display:block}
.tb{max-width:880px;margin:0 auto 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:12px;padding:12px 14px}
.tb .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.tb .seg button{border:0;background:#fff;padding:7px 13px;font-weight:600;font-size:13px}
.tb .seg button.on{background:var(--blue);color:#fff}
.tb label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500}
.tb .sp{flex:1}
.sheet{background:#fff;max-width:880px;margin:0 auto;padding:46px 52px;min-height:1100px;box-shadow:0 20px 60px rgba(0,0,0,.35);color:#111827;font-size:13px;line-height:1.5}
.sheet.short{min-height:0}
.sh-top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--blue);padding-bottom:14px;margin-bottom:22px}
.sh-brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:15px}
.sh-brand i{width:24px;height:24px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.sh-brand svg{width:15px;height:15px}
.sh-top small{color:#6B7488}
.sh-id{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.sh-id .av{width:68px;height:68px;font-size:24px}
.sh-id h2{font-size:24px;letter-spacing:-.02em;line-height:1.15}
.sh-id p{color:#4A5468;font-size:14px}
.sh-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.sh-facts div{background:#F3F6FC;border-radius:8px;padding:9px 12px}
.sh-facts small{display:block;color:#6B7488;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sh-facts b{font-size:14px}
.sheet h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-d);margin:20px 0 8px;border-bottom:1px solid #E2E7F0;padding-bottom:4px}
.sh-sk{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 28px}
.sh-sk>div{display:grid;grid-template-columns:1fr 84px 38px;gap:8px;align-items:center}
.sh-ex{margin-bottom:11px;break-inside:avoid}
.sh-ex b{font-size:13.5px}
.sh-ex span{color:#6B7488}
.sh-foot{margin-top:28px;padding-top:12px;border-top:1px solid #E2E7F0;font-size:11px;color:#6B7488;display:flex;justify-content:space-between}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-weight:500;display:none}
.toast.on{display:block}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line2);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;display:flex;gap:10px;align-items:center}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{background:rgba(127,140,165,.2);border-radius:99px;padding:0 9px;font-size:12.5px}
.tab.on .n{background:rgba(255,255,255,.2)}
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.phase div{padding:11px 14px;border-radius:10px;background:#E8ECF3;color:var(--muted);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.phase div.done{background:var(--green-l);color:var(--green)}
.phase div.cur{background:var(--blue);color:#fff}
.chk{display:grid;gap:6px}
.chk div{display:flex;gap:9px;align-items:center;font-size:13.5px}
.chk i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;flex:none;background:#E8ECF3;color:var(--muted)}
.chk .ok i{background:var(--green);color:#fff}
.chk .ok{color:var(--ink)}
.retn{background:#FFF1F0;border:1px solid #F5C6C1;color:#8A2B22;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.lock{background:var(--amber-l);color:#7A4B00;border-radius:10px;padding:10px 14px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .brand{padding:4px 8px}.side .sp,.demo{display:none}
  .nv{width:auto;padding:8px 10px}
  .filters{grid-template-columns:1fr 1fr}
  .dgrid{grid-template-columns:1fr}
  .match{grid-template-columns:44px 1fr;}
  .match>*:nth-child(3),.match>*:nth-child(4){grid-column:2}
  .sheet{padding:26px 20px}.sh-facts{grid-template-columns:1fr 1fr}.sh-sk{grid-template-columns:1fr}
}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.edit-sk{grid-template-columns:1fr 1fr}}
@media print{
  body{background:#fff}
  .app,.toast,.tb{display:none!important}
  .ov{position:static;display:block;padding:0;background:none;overflow:visible}
  .sheet{box-shadow:none;max-width:none;padding:0;min-height:0;margin:0}
  @page{margin:14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ============ Matching ============ */
function score(d,r){
  let tot=0,got=0,miss=[],hit=[];
  r.skills.forEach(([n,min])=>{
    tot+=min;
    const s=d.skills.find(x=>x[0].toLowerCase()===n.toLowerCase());
    if(!s){miss.push(n);return}
    got+=Math.min(s[1],min); hit.push([n,s[1],min]);
    if(s[1]<min) miss.push(n+" ("+s[1]+"/"+min+")");
  });
  let p=tot?got/tot:0;
  if(d.sen===r.sen)p=Math.min(1,p+.04);
  if(days(d.avail)>days(r.start))p*=.85;
  return {pct:Math.round(p*100),miss,hit};
}

/* ============ Events ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.tagName==="SELECT"||el.type==="checkbox")return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==="ui"){ui=v;S.sheetLang=v;render();if($("#ov").classList.contains("on"))openSheet()}
  else if(a==="role"){S.role=v;S.pool=v==="eg"?"p1":"p2";S.view="devs";S.edit=false;$("#ov").classList.remove("on");render()}
  else if(a==="pool"){S.pool=v;render()}
  else if(a==="submit"){const d=devs.find(x=>x.id===S.dev);if(!complete(d)){toast(t("needComplete"));return}d.status="sub";d.reviewNote="";logAdd(d,"aSubmit");persist();render();toast(t("saved"))}
  else if(a==="approve"){const d=devs.find(x=>x.id===S.dev);if(!complete(d)){toast(t("needComplete"));return}d.status="p2";logAdd(d,"aApprove");S.pool="p2";persist();render();toast(t("approved"))}
  else if(a==="retur"){const d=devs.find(x=>x.id===S.dev);const n=prompt(t("retPrompt"),"");if(n===null)return;d.status="p1";d.reviewNote=n;logAdd(d,"aReturn");S.pool="p1";persist();render()}
  else if(a==="demote"){const d=devs.find(x=>x.id===S.dev);d.status="p1";logAdd(d,"aDemote");reqs.forEach(r=>r.assigned=r.assigned.filter(x=>x!==d.id));S.pool="p1";persist();render()}
  else if(a==="view"){S.view=v;S.edit=false;render();window.scrollTo(0,0)}
  else if(a==="open"){S.dev=+v;S.view="detail";S.edit=false;if(S.role==="eg"&&false)S.pool="p1";render();window.scrollTo(0,0)}
  else if(a==="fsk"){S.fSk=S.fSk.includes(v)?S.fSk.filter(x=>x!==v):[...S.fSk,v];render()}
  else if(a==="edit"){S.edit=true;render()}
  else if(a==="cancel"){const d=devs.find(x=>x.id===S.dev);if(d&&d._new){devs.splice(devs.indexOf(d),1);S.view="devs"}S.edit=false;render()}
  else if(a==="save"){const d=devs.find(x=>x.id===S.dev);delete d._new;if(!d.name.trim())d.name="–";S.edit=false;persist();render();toast(t("saved"))}
  else if(a==="delete"){if(confirm(t("confirmDel"))){const i=devs.findIndex(x=>x.id===S.dev);devs.splice(i,1);reqs.forEach(r=>r.assigned=r.assigned.filter(x=>x!==S.dev));S.view="devs";S.edit=false;persist();render();toast(t("deleted"))}}
  else if(a==="newdev"){const d={id:++uid,name:"",title:"",sen:"mid",loc:"Remote",avail:plus(0),rate:40,status:"p1",consent:false,sum:{de:"",en:""},skills:[],exp:[],edu:{de:"",en:""},certs:[],langs:[],note:"",_new:true,log:[{r:S.role,a:"aCreate",d:iso(today)}]};devs.push(d);S.dev=d.id;S.view="detail";S.edit=true;render()}
  else if(a==="addsk"){devs.find(x=>x.id===S.dev).skills.push(["",3,1]);render()}
  else if(a==="rmsk"){devs.find(x=>x.id===S.dev).skills.splice(+v,1);render()}
  else if(a==="addex"){devs.find(x=>x.id===S.dev).exp.push({role:"",co:"",from:"",to:"",text:{de:"",en:""}});render()}
  else if(a==="rmex"){devs.find(x=>x.id===S.dev).exp.splice(+v,1);render()}
  else if(a==="sheet"){openSheet()}
  else if(a==="closesheet"){$("#ov").classList.remove("on")}
  else if(a==="doprint"){window.print()}
  else if(a==="smode"){S.sheetMode=v;openSheet()}
  else if(a==="slang"){S.sheetLang=v;openSheet()}
  else if(a==="pickreq"){S.req=+v;render()}
  else if(a==="gotoreq"){S.req=+v;S.view="reqs";render()}
  else if(a==="assign"){const r=reqs.find(x=>x.id===S.req);const i=r.assigned.indexOf(+v);if(i>=0)r.assigned.splice(i,1);else{r.assigned.push(+v);if(r.status==="open")r.status="prop"}persist();render()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="fsen"){S.fSen=el.value;render()}

  else if(el.dataset.act==="rstatus"){reqs.find(x=>x.id===S.req).status=el.value;persist();render()}

  const el=e.target;
  if(el.id==="q"){S.q=el.value;const pos=el.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
  else if(el.dataset.f||el.dataset.sk!==undefined||el.dataset.ex!==undefined){applyEdit(el)}

function applyEdit(el){
  const d=devs.find(x=>x.id===S.dev); if(!d)return;
  if(el.dataset.f){
    const f=el.dataset.f,v=el.value;
    if(f==="sum")d.sum[ui]=v; else if(f==="edu")d.edu[ui]=v;
    else if(f==="certs")d.certs=v.split(";").map(x=>x.trim()).filter(Boolean);
    else if(f==="langs")d.langs=v.split(";").map(x=>x.trim().split(":")).filter(x=>x[0]).map(x=>[x[0].trim(),(x[1]||"").trim()]);
    else if(f==="placed")d.placed=v==="1"; else if(f==="rate")d.rate=+v||0; else if(f==="consent")d.consent=v==="1";
    else d[f]=v;
  } else if(el.dataset.sk!==undefined){
    const s=d.skills[+el.dataset.sk],k=+el.dataset.k; s[k]=k===0?el.value:(+el.value||0);
  } else {
    const x=d.exp[+el.dataset.ex],k=el.dataset.k; if(k==="text")x.text[ui]=el.value; else x[k]=el.value;
  }
}
