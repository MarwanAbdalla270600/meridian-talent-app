# Git hooks (installed via `bun install` -> prepare script).
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,js,json,html,css,md,yml,yaml}'
      run: bunx prettier --check {staged_files}
    - name: eslint
      glob: '*.{ts,js}'
      run: bunx eslint --max-warnings=0 {staged_files}
commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits"; exit 1; }
