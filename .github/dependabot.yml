version: 2
updates:
  - package-ecosystem: npm # covers bun.lock workspaces
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      angular: { patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint'] }
      aws-sdk: { patterns: ['@aws-sdk/*'] }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
