name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  quality:
    name: Lint, typecheck, unit & integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://meridian:meridian@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit --audit-level=high
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Install Chromium for PDF tests
        run: cd apps/api && bunx playwright install --with-deps --only-shell chromium
      - run: bun run --filter '@meridian/shared' test
      - run: bun run --filter '@meridian/api' test
      - run: bun run --filter '@meridian/web' test
      - name: Angular production build
        run: bun run --filter '@meridian/web' build

  docker:
    name: Docker images (build, scan, e2e, publish on tag)
    runs-on: ubuntu-24.04
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          load: true
          tags: meridian-talent-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          load: true
          tags: meridian-talent-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Trivy scan (API)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: meridian-talent-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy scan (web)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: meridian-talent-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Start production stack (local TLS) with demo seed
        run: |
          cp deploy/e2e.env deploy/.env.prod
          docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.e2e.yml up -d --wait
      - name: Playwright E2E
        run: |
          cd apps/web
          bunx playwright install --with-deps chromium
          CI=1 E2E_BASE_URL=https://localhost bunx playwright test
      - name: E2E logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.e2e.yml logs --no-color | tail -300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Push images to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${GITHUB_REF_NAME}"
          # GHCR requires lowercase repository names (the owner may contain capitals).
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for img in api web; do
            docker tag meridian-talent-$img:ci $REGISTRY/meridian-talent-$img:$TAG
            docker tag meridian-talent-$img:ci $REGISTRY/meridian-talent-$img:latest
            docker push $REGISTRY/meridian-talent-$img:$TAG
            docker push $REGISTRY/meridian-talent-$img:latest
          done

  deploy:
    name: Deploy to production (Hetzner)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-24.04
    # Secrets live in the GitHub environment "production" (optionally with required reviewers).
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # The server key is restricted to deploy/deploy.sh (forced command); the tag is the argument.
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy ${GITHUB_REF_NAME}"
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${{ vars.DEPLOY_DOMAIN }}/api/health"
