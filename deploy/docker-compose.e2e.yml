# Override for end-to-end tests of the production images (CI and local):
#   cp deploy/e2e.env deploy/.env
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.e2e.yml up -d --wait
services:
  seed:
    profiles: !reset []
  minio:
    profiles: !reset []
  mailpit:
    image: axllent/mailpit:v1.33.0
    networks: [edge]
    ports: ['127.0.0.1:8025:8025']
  caddy:
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./e2e/sites:/etc/caddy/sites:ro,z
      - caddy_data:/data
      - caddy_config:/config
  api:
    depends_on:
      minio: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
